<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAU CLOUD — мобильная версия</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e8eef1;color:#173443;font:14px Arial,sans-serif;display:grid;justify-items:center;gap:14px;padding:20px 12px}h1{font-size:20px;margin:0}p{margin:0;text-align:center;line-height:1.5}select{font:inherit;min-height:44px;padding:10px;border:1px solid #b7cad4;border-radius:12px;background:#fff;color:#173443}iframe{width:390px;max-width:100%;height:844px;border:1px solid #b7cad4;border-radius:22px;background:#fff;box-shadow:0 15px 50px #17344220}a{color:#156482}.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:center}@media(max-width:450px){body{padding:12px 0}iframe{border-radius:0}}
</style></head><body>
<h1>04 · Скролл-навигатор</h1><p>Прокрутите внутри телефона, чтобы увидеть индикаторы и анимацию.</p>
<div class="toolbar"><label>Экран <select id="size"><option value="390,844">390 × 844</option><option value="360,640">360 × 640</option><option value="430,932">430 × 932</option></select></label><a href="/" target="_blank" rel="noopener">Открыть сайт ↗</a></div>
<iframe src="/" title="Мобильный сайт TAU CLOUD — скролл-навигатор 04"></iframe>
<script type="module">
const frame=document.querySelector('iframe');
document.querySelector('#size').onchange=event=>{const [w,h]=event.target.value.split(',');frame.style.width=w+'px';frame.style.height=h+'px';};
</script></body></html>
